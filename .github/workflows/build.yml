name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q StreakBot.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle -p StreakBot :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: StreakBot-debug-apk
          path: StreakBot/app/build/outputs/apk/debug/app-debug.apk
