name: Build APK dari ZIP
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak ZIP otomatis
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "::error::Tidak ada file .zip di root repo"; exit 1; fi
          echo "Memakai: $ZIP"
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src
          SETTINGS=$(find _src -name "settings.gradle*" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "::error::settings.gradle tidak ditemukan di dalam zip"; exit 1; fi
          PROJ=$(dirname "$SETTINGS")
          echo "Folder proyek: $PROJ"
          echo "PROJ=$PROJ" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: APK-debug
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
          
